name: 'dist-parity'
description: 'Check Python sdist/wheel core metadata consistency before publishing'
branding:
  icon: 'check-circle'
  color: 'blue'
inputs:
  dist-dir:
    description: 'Folder containing exactly one sdist and wheel'
    required: false
    default: 'dist'
  sdist:
    description: 'Explicit source distribution (.tar.gz); requires wheel, overrides dist-dir'
    required: false
    default: ''
  wheel:
    description: 'Explicit wheel (.whl); requires sdist, overrides dist-dir'
    required: false
    default: ''
  format:
    description: 'Output format: text (default) or json; the JSON schema matches --json CLI output'
    required: false
    default: 'text'
runs:
  using: 'composite'
  steps:
    - name: Check package metadata parity
      shell: bash
      env:
        DIST_PARITY_ACTION_PATH: ${{ github.action_path }}
        DIST_PARITY_DIST_DIR: ${{ inputs['dist-dir'] }}
        DIST_PARITY_SDIST: ${{ inputs['sdist'] }}
        DIST_PARITY_WHEEL: ${{ inputs['wheel'] }}
        DIST_PARITY_FORMAT: ${{ inputs['format'] }}
      run: |
        set -euo pipefail
        args=()
        case "$DIST_PARITY_FORMAT" in
          text) ;;
          json) args+=(--json) ;;
          *)
            echo "dist-parity: format must be text or json (got '$DIST_PARITY_FORMAT')" >&2
            exit 2
            ;;
        esac
        if [[ -n "$DIST_PARITY_SDIST" || -n "$DIST_PARITY_WHEEL" ]]; then
          # Let the CLI validate incomplete explicit pairs, including JSON exit-2 errors.
          if [[ -n "$DIST_PARITY_SDIST" ]]; then args+=(--sdist "$DIST_PARITY_SDIST"); fi
          if [[ -n "$DIST_PARITY_WHEEL" ]]; then args+=(--wheel "$DIST_PARITY_WHEEL"); fi
        else
          args+=(--dist-dir "$DIST_PARITY_DIST_DIR")
        fi
        PYTHONPATH="$DIST_PARITY_ACTION_PATH/src${PYTHONPATH:+:$PYTHONPATH}" python -m dist_parity "${args[@]}"
