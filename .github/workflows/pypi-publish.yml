name: Publish v0.1.1 to PyPI (manual)

# Publishing never happens automatically on pushes, pull requests or GitHub releases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Upload previously released and hash-verified distributions
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the exact GitHub v0.1.1 release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download v0.1.1 --repo swiast/dist-parity --dir dist \
            --pattern 'dist_parity-0.1.1*'
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          cd dist
          cat <<'CHECKSUMS' | sha256sum --check --strict
          2d9664238562ea969d93713cc8f68a6f00943155b24f82813f54a6908cfd7488  dist_parity-0.1.1-py3-none-any.whl
          12ff6f78b27bbd0fc8ca72d4754f4b970125ad1fd5a1807b763f3ef57ce7a548  dist_parity-0.1.1.tar.gz
          CHECKSUMS

      - name: Publish to PyPI with short-lived OIDC credentials
        uses: pypa/gh-action-pypi-publish@release/v1
