name: Publish v0.1.0 to PyPI (manual)

# Publishing never happens automatically on pushes, pull requests or GitHub releases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Upload previously released and hash-verified distributions
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the exact GitHub v0.1.0 release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download v0.1.0 --repo swiast/dist-parity --dir dist \
            --pattern 'dist_parity-0.1.0*'
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          cd dist
          cat <<'CHECKSUMS' | sha256sum --check --strict
          32ef689850a8d06056066aa1ba309cf08785e1c052efe6aee67fa4329c6927a1  dist_parity-0.1.0-py3-none-any.whl
          ebeb5125ee03352e0f2931134cc2d64ed228d913326c73ce8488a26b8ac5ae78  dist_parity-0.1.0.tar.gz
          CHECKSUMS

      - name: Publish to PyPI with short-lived OIDC credentials
        uses: pypa/gh-action-pypi-publish@release/v1
