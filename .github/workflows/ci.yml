name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python examples/quickstart.py
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: PYTHONPATH=src python -m dist_parity --dist-dir dist

  release:
    name: Release v0.1.0 after successful CI
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify release version
        run: python -c "import tomllib; assert tomllib.load(open('pyproject.toml', 'rb'))['project']['version'] == '0.1.0'"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: PYTHONPATH=src python -m dist_parity --dist-dir dist
      - name: Create tag and GitHub release once
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "Release already exists: no changes made."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.0 >/dev/null 2>&1; then
            echo "Tag exists without a release: refusing to replace it."
            exit 1
          fi
          gh release create v0.1.0 dist/*.tar.gz dist/*.whl \
            --target "$GITHUB_SHA" --title "dist-parity v0.1.0" \
            --notes-file RELEASE_NOTES.md
