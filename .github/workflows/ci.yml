name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -c "import tomllib, dist_parity; assert tomllib.load(open('pyproject.toml', 'rb'))['project']['version'] == dist_parity.__version__"
      - run: python -m unittest discover -s tests -v
      - run: python examples/quickstart.py
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: PYTHONPATH=src python -m dist_parity --dist-dir dist

# Deliberately NO release job. Pushing to main must only verify source.
# A separately authorized publication process must not re-use v0.1.2 assets.
