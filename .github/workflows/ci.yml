name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -c "import tomllib, dist_parity; assert tomllib.load(open('pyproject.toml', 'rb'))['project']['version'] == dist_parity.__version__"
      - run: python -m unittest discover -s tests -v
      - run: python examples/quickstart.py
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: PYTHONPATH=src python -m dist_parity --dist-dir dist

  release:
    name: Release v0.1.2 after successful CI
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify release version
        run: python -c "import tomllib; assert tomllib.load(open('pyproject.toml', 'rb'))['project']['version'] == '0.1.2'"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: PYTHONPATH=src python -m dist_parity --dist-dir dist
      - name: Create immutable v0.1.2 release and verify downloaded assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v0.1.2 >/dev/null 2>&1; then
            echo "Release already exists: no changes made."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.2 >/dev/null 2>&1; then
            echo "Tag exists without a release: refusing to replace it."
            exit 1
          fi
          sha256sum dist/* | sed 's#  dist/#  #' > release-sha256.txt
          gh release create v0.1.2 dist/*.tar.gz dist/*.whl release-sha256.txt \
            --target "$GITHUB_SHA" --title "dist-parity v0.1.2" \
            --notes-file RELEASE_NOTES.md
          mkdir -p verified-release
          gh release download v0.1.2 --repo swiast/dist-parity \
            --dir verified-release --pattern 'dist_parity-0.1.2*'
          (cd verified-release && sha256sum --check --strict ../release-sha256.txt)
          cat release-sha256.txt >> "$GITHUB_STEP_SUMMARY"
