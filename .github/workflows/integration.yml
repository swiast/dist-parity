name: Integration verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integration.yml'
      - 'src/**'
      - 'action.yml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - '.github/workflows/integration.yml'
      - 'src/**'
      - 'action.yml'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  action-and-public-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build this project's distributions
        run: |
          python -m pip install -e .
          python -m pip install build
          python -m build
      - name: Execute local composite action end-to-end
        uses: ./
        with:
          dist-dir: dist
      - name: Download public packaging sdist and build its wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external
          python -m pip download --no-deps --no-binary=:all: --dest external "packaging==25.0"
          python -m pip wheel --no-deps --wheel-dir external external/packaging-25.0.tar.gz
      - name: Exercise real public-package diagnostic
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python -m dist_parity --sdist external/packaging-25.0.tar.gz --wheel external/packaging-25.0-*.whl --json > external/diagnostic.json || status=$?
          if [[ "$status" != "0" && "$status" != "1" ]]; then
            echo "Unexpected input or execution error: exit $status"
            cat external/diagnostic.json
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("external/diagnostic.json").read_text())
          assert report["project"] == "packaging", report
          assert isinstance(report["findings"], list)
          print(json.dumps(report, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("packaging 25.0 sdist-to-wheel diagnostic: " +
                            ("PARITY OK" if report["ok"] else "MISMATCH DETECTED") + "\n")
              for finding in report["findings"]:
                  summary.write("- " + finding["code"] + ": " + finding["message"] + "\n")
          PY
