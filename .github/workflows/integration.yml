name: Integration verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integration.yml'
      - 'src/**'
      - 'action.yml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - '.github/workflows/integration.yml'
      - 'src/**'
      - 'action.yml'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  action-and-public-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build this project's distributions
        run: |
          python -m pip install -e .
          python -m pip install build
          python -m build
      - name: Execute local composite action end-to-end
        uses: ./
        with:
          dist-dir: dist
      - name: Prepare multi-wheel regression fixture
        shell: bash
        run: |
          set -euo pipefail
          sdist="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$sdist" && test -n "$wheel"
          cp "$wheel" dist/ignored-0.0-py3-none-any.whl
          status=0
          python -m dist_parity --dist-dir dist >/dev/null 2>&1 || status=$?
          if [[ "$status" -ne 2 ]]; then
            echo "Expected ambiguous dist-dir to exit 2; got $status" >&2
            exit 1
          fi
          printf 'CHECK_SDIST=%s\nCHECK_WHEEL=%s\n' "$sdist" "$wheel" >> "$GITHUB_ENV"
      - name: Verify explicit artifacts work with multiple wheels present
        uses: ./
        with:
          sdist: ${{ env.CHECK_SDIST }}
          wheel: ${{ env.CHECK_WHEEL }}
      - name: Reject incomplete Action artifact pair
        id: incomplete_pair
        continue-on-error: true
        uses: ./
        with:
          sdist: ${{ env.CHECK_SDIST }}
      - name: Assert incomplete pair failed
        if: always()
        shell: bash
        run: test "${{ steps.incomplete_pair.outcome }}" = "failure"
      - name: Download public packaging sdist and build its wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external
          python -m pip download --no-deps --no-binary=:all: --dest external "packaging==25.0"
          python -m pip install "flit_core==4.2.0" "wheel==0.48.0"
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir external external/packaging-25.0.tar.gz
          python - <<'PY'
          from importlib.metadata import version
          for package in ("flit_core", "pip", "wheel"):
              print(f"Build environment: {package}=={version(package)}")
          PY
      - name: Compare with historical flit_core 3.12.0
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "flit_core==3.12.0"
          mkdir -p external/flit312
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir external/flit312 external/packaging-25.0.tar.gz
          python - <<'PY'
          from email import policy
          from email.parser import BytesParser
          from pathlib import Path
          import zipfile
          wheel, = Path("external/flit312").glob("packaging-25.0-*.whl")
          with zipfile.ZipFile(wheel) as archive:
              name, = (p for p in archive.namelist() if p.endswith(".dist-info/METADATA"))
              data = BytesParser(policy=policy.compat32).parsebytes(archive.read(name))
          print("Historical flit_core: 3.12.0")
          print("Historical built wheel Metadata-Version:", data.get("Metadata-Version"))
          print("Historical built wheel Import-Name:", data.get_all("Import-Name", []))
          assert data.get("Metadata-Version") == "2.4", "historical metadata version changed"
          assert data.get_all("Import-Name", []) == [], "historical wheel unexpectedly declares Import-Name"
          PY
          status=0
          python -m dist_parity --sdist external/packaging-25.0.tar.gz --wheel external/flit312/packaging-25.0-*.whl --json > external/flit312/diagnostic.json || status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "Expected PARITY_OK for packaging 25.0 rebuilt with flit_core 3.12.0; got exit $status" >&2
            cat external/flit312/diagnostic.json
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("external/flit312/diagnostic.json").read_text())
          assert result["ok"] is True, result
          assert result["project"] == "packaging", result
          assert not [item for item in result["findings"] if item["severity"] == "error"], result
          print("ASSERTED historical flit_core 3.12.0: parity PASS")
          PY
          echo "ASSERTED: flit_core 3.12.0 → parity PASS (exit 0)" >> "$GITHUB_STEP_SUMMARY"
      - name: Record source and wheel metadata headers
        shell: bash
        run: |
          python - <<'PY'
          from email import policy
          from email.parser import BytesParser
          from pathlib import Path
          import tarfile
          import zipfile

          sdists = list(Path("external").glob("packaging-25.0.tar.gz"))
          wheels = list(Path("external").glob("packaging-25.0-*.whl"))
          assert len(sdists) == len(wheels) == 1, (sdists, wheels)
          with tarfile.open(sdists[0], "r:gz") as archive:
              info = archive.extractfile("packaging-25.0/PKG-INFO")
              assert info is not None
              sdata = info.read(2_000_001)
          with zipfile.ZipFile(wheels[0]) as archive:
              entries = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")]
              assert len(entries) == 1, entries
              wdata = archive.read(entries[0])
          parsed = {}
          for label, data in (("source PKG-INFO", sdata), ("built wheel METADATA", wdata)):
              msg = BytesParser(policy=policy.compat32).parsebytes(data)
              parsed[label] = msg
              print(f"{label}:")
              for header in ("Metadata-Version", "Name", "Version", "Dynamic", "Import-Name", "Import-Namespace"):
                  print(f"  {header}: {msg.get_all(header, [])!r}")
          assert parsed["source PKG-INFO"].get("Metadata-Version") == "2.4"
          assert parsed["built wheel METADATA"].get("Metadata-Version") == "2.5"
          assert parsed["built wheel METADATA"].get_all("Import-Name", []) == ["packaging"]
          PY
      - name: Exercise real public-package diagnostic
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python -m dist_parity --sdist external/packaging-25.0.tar.gz --wheel external/packaging-25.0-*.whl --json > external/diagnostic.json || status=$?
          if [[ "$status" -ne 1 ]]; then
            echo "Expected FIELD_MISMATCH for packaging 25.0 rebuilt with flit_core 4.2.0; got exit $status" >&2
            cat external/diagnostic.json
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("external/diagnostic.json").read_text())
          assert report["project"] == "packaging", report
          assert report["ok"] is False, report
          errors = [(item["code"], item.get("field")) for item in report["findings"] if item["severity"] == "error"]
          assert errors == [("FIELD_MISMATCH", "import-name")], errors
          print("ASSERTED flit_core 4.2.0: exactly one Import-Name metadata mismatch")
          print(json.dumps(report, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("packaging 25.0 sdist-to-wheel diagnostic: " +
                            ("PARITY OK" if report["ok"] else "MISMATCH DETECTED") + "\n")
              for finding in report["findings"]:
                  summary.write("- " + finding["code"] + ": " + finding["message"] + "\n")
          PY
