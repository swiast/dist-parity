name: Published v0.1.2 release smoke

on:
  pull_request:
    paths:
      - '.github/workflows/release-smoke.yml'
      - 'docs/RELEASE_VALIDATION.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-smoke.yml'
      - 'docs/RELEASE_VALIDATION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  released-cli:
    name: Install published wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download published GitHub release assets and verify recorded hashes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download v0.1.2 --repo swiast/dist-parity --dir release \
            --pattern 'dist_parity-0.1.2*'
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 2
          cd release
          cat <<'CHECKSUMS' | sha256sum --check --strict
          f7404baf015ebea9a188764713839b5a0244d6237dfe46b12c5d2ff576f75aa1  dist_parity-0.1.2-py3-none-any.whl
          40e61f0b8fdc9cb5a5e66fd3a561b7b314c744a9c431ecfc15cce89008d851da  dist_parity-0.1.2.tar.gz
          CHECKSUMS
      - name: Install the released wheel, not the checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps ./release/dist_parity-0.1.2-py3-none-any.whl
          python - <<'PY'
          from importlib.metadata import version
          import dist_parity
          assert version("dist-parity") == "0.1.2"
          assert dist_parity.__version__ == "0.1.2"
          print("Installed GitHub v0.1.2 wheel successfully")
          PY
          dist-parity --help >/dev/null
          python -m dist_parity --help >/dev/null
      - name: Run negative-control quickstart with installed wheel
        run: python examples/quickstart.py

  released-action:
    name: Execute published v0.1.2 composite action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build source distribution and wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build
      - name: Run composite action at published tag
        uses: swiast/dist-parity@v0.1.2
        with:
          dist-dir: dist
      - name: Stage extra wheel and select explicit matching pair
        shell: bash
        run: |
          set -euo pipefail
          sdist="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$sdist" && test -n "$wheel"
          cp "$wheel" dist/ignored-0.0-py3-none-any.whl
          printf 'CHECK_SDIST=%s\nCHECK_WHEEL=%s\n' "$sdist" "$wheel" >> "$GITHUB_ENV"
      - name: Run published Action with explicit artifact pair
        uses: swiast/dist-parity@v0.1.2
        with:
          sdist: ${{ env.CHECK_SDIST }}
          wheel: ${{ env.CHECK_WHEEL }}
      - name: Published Action should reject incomplete pair
        id: incomplete_pair
        continue-on-error: true
        uses: swiast/dist-parity@v0.1.2
        with:
          sdist: ${{ env.CHECK_SDIST }}
      - name: Verify incomplete pair failure
        if: always()
        run: test "${{ steps.incomplete_pair.outcome }}" = "failure"
