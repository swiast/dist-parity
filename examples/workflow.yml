# Copy into your project's .github/workflows/release-check.yml
name: Package artifact parity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      # Published v0.1.2 supports one artifact pair with dist-dir.
      # Multi-wheel projects may invoke @v0.1.2 separately for each wheel:
      # - uses: swiast/dist-parity@v0.1.2
      #   with:
      #     sdist: dist/example-1.0.tar.gz
      #     wheel: dist/example-1.0-py3-none-any.whl
      - uses: swiast/dist-parity@v0.1.2
        with:
          dist-dir: dist
