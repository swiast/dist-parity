# Copy into your project's .github/workflows/release-check.yml
name: Package artifact parity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      # After the project is published and tagged:
      - uses: swiast/dist-parity@v0.1.1
        with:
          dist-dir: dist
