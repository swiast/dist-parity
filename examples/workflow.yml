# Copy into your project's .github/workflows/release-check.yml
name: Package artifact parity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      # Published v0.1.1 supports one sdist/wheel pair via dist-dir.
      # Unreleased main adds explicit sdist and wheel Action inputs for multi-wheel builds;
      # wait for a verified newer tag before using those new inputs in production.
      - uses: swiast/dist-parity@v0.1.1
        with:
          dist-dir: dist
